<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Мои пары · АПОб-22-</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f2f3f7,#14161d);--paper:light-dark(#fff,#22252e);--ink:light-dark(#202637,#f0f1f8);--muted:light-dark(#747b8d,#a3aabb);--accent:light-dark(#6263d9,#b0aaff);--line:light-dark(#e0e3eb,#383c49);--soft:light-dark(#e9eaf0,#2b2e39);--green:light-dark(#e0f3e5,#203c2b);--green-ink:light-dark(#27683b,#ade0b8);--orange:light-dark(#fff0dd,#413123);--orange-ink:light-dark(#88521d,#f2c28d)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{cursor:wait;opacity:.55}a{color:var(--accent)}
.app{max-width:960px;margin:0 auto;padding:38px 34px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:47px}.brand{font-size:21px;font-weight:650;letter-spacing:-.6px;display:flex;align-items:center;gap:12px}.brand-icon{background:var(--paper);color:var(--accent);width:35px;height:35px;border-radius:11px;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 8px #00000005}.group{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.icon-button{border:1px solid var(--line);border-radius:11px;min-width:40px;min-height:40px;padding:7px 11px;background:transparent;font-size:13px}.refresh-icon{display:inline-block;font-size:19px;vertical-align:-1px;margin-right:6px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:7px}.heading{font-size:38px;font-weight:650;letter-spacing:-1.3px;line-height:1.15;margin:0}.date-label{color:var(--muted);font-size:13px;margin-top:9px}.week-control{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}.week-control button{border:0;padding:8px 13px;border-radius:9px;background:transparent;font-size:12px;white-space:nowrap}.week-control button[aria-pressed=true]{background:var(--paper);box-shadow:0 2px 5px #00000008}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:28px}.days button{background:transparent;border:0;border-radius:15px;min-height:65px;padding:9px 5px;color:var(--muted);font-size:13px}.days strong{display:block;font-size:19px;font-weight:600;margin-top:2px}.days button[aria-pressed=true]{background:var(--accent);color:light-dark(#fff,#1a1930)}.days button.today:not([aria-pressed=true]) strong{color:var(--accent)}.section-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:14px;color:var(--muted);font-size:12px}.lesson{display:grid;grid-template-columns:77px minmax(0,1fr);gap:18px;margin-bottom:13px}.clock{padding-top:19px;font-weight:600;font-variant-numeric:tabular-nums}.clock small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}.sheet{padding:18px 22px;border-radius:18px;background:var(--paper);box-shadow:0 4px 18px #00000002;min-width:0}.kind{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:6px}.subject{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.2px;margin:0 0 10px;overflow-wrap:anywhere}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.room{white-space:nowrap}.status{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:600;margin-bottom:17px}.status-label{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.lesson.current .sheet{background:var(--green);color:var(--green-ink)}.lesson.current .subject{color:var(--ink)}.lesson.current .kind,.lesson.current .meta{color:var(--green-ink)}.lesson.next .sheet{background:var(--orange);color:var(--orange-ink)}.lesson.next .subject{color:var(--ink)}.lesson.next .kind,.lesson.next .meta{color:var(--orange-ink)}.lesson.featured .sheet{padding:28px;border-radius:23px}.lesson.featured .subject{font-size:27px;letter-spacing:-.7px;margin-bottom:23px}.lesson.featured .meta{font-size:14px}.lesson.featured .clock{font-size:19px;padding-top:27px}.lesson.featured .clock small{font-size:13px}.progress{height:4px;border-radius:3px;background:light-dark(#bfdcc7,#3b6046);margin-top:26px;overflow:hidden}.progress span{height:100%;display:block;background:light-dark(#40905a,#98d3a7);border-radius:3px}.lesson.next:not(.featured) .subject{font-size:18px}.past .sheet{background:transparent;border:1px solid var(--line);box-shadow:none}.past .subject{color:var(--muted);font-weight:400;font-size:14px}.past .kind{color:var(--muted)}details{margin-top:24px}summary{font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:15px}.notice{padding:12px 15px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted);margin-bottom:18px}.notice[hidden]{display:none}.empty{padding:55px 20px 65px;text-align:center}.empty-icon{font-size:30px;color:var(--accent);margin-bottom:12px}.empty h2{font-size:23px;font-weight:600;letter-spacing:-.5px;margin:0 0 7px}.empty p{font-size:13px;color:var(--muted);margin:0}.footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:12px;color:var(--muted);font-size:11px}.footer a{color:var(--muted);text-decoration:none}.settings{background:var(--paper);padding:20px;border-radius:16px;margin:0 0 25px}.settings[hidden]{display:none}.settings label{display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:13px}.settings select{padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.settings p{font-size:12px;color:var(--muted);margin:12px 0 0}.loading{padding:60px 0;color:var(--muted);text-align:center}.today-button{color:var(--accent)}
@media(max-width:600px){.app{padding:22px 17px 35px}.top{margin-bottom:31px}.brand{font-size:19px;gap:8px}.group{font-size:11px}.heading{font-size:30px}.head{align-items:start;flex-direction:column;gap:17px}.actions{gap:5px}.icon-button{padding:6px 9px}.refresh-text{display:none}.refresh-icon{margin:0}.days{gap:3px}.days button{min-height:60px}.lesson{grid-template-columns:55px minmax(0,1fr);gap:8px}.sheet{padding:16px}.lesson.featured .sheet{padding:21px 18px}.lesson.featured .subject{font-size:22px}.lesson.featured .clock{font-size:16px;padding-top:22px}.lesson.featured .meta{font-size:12px}.subject{font-size:14px}.lesson.next:not(.featured) .subject{font-size:16px}.footer{flex-direction:column}.status{font-size:11px}.brand-icon{width:30px;height:30px}.section-head span:last-child{display:none}}
</style>
</head>
<body><main class="app">
<header class="top"><div><div class="brand"><span class="brand-icon" aria-hidden="true">▦</span>Мои пары</div><div class="group">АПОб-22- · МГТУ им. Носова</div></div><div class="actions"><button id="today" class="icon-button today-button">Сегодня</button><button id="refresh" class="icon-button" aria-label="Проверить обновления"><span class="refresh-icon" aria-hidden="true">↻</span><span class="refresh-text">Проверить</span></button><button id="settings-button" class="icon-button" aria-label="Настройки" aria-expanded="false">☷</button></div></header>
<section id="settings" class="settings" hidden><label>Оформление<select id="theme"><option value="auto">Как в системе</option><option value="light">Светлое</option><option value="dark">Тёмное</option></select></label><p>Время занятий — Магнитогорск (UTC+5). Чётность рассчитана по правилу сайта МГТУ; её можно переключить вручную.</p></section>
<div class="head"><div><div class="eyebrow" id="eyebrow">Личное расписание</div><h1 class="heading" id="heading">Сегодня</h1><div class="date-label" id="date-label"></div></div><div class="week-control" aria-label="Чётность недели"><button data-week="1" aria-pressed="false">Нечётная</button><button data-week="2" aria-pressed="true">Чётная</button></div></div>
<nav class="days" aria-label="Дни недели" id="days"></nav>
<div class="notice" id="notice" role="status" hidden></div>
<div class="section-head"><span id="count">Загрузка расписания</span><span id="clock"></span></div>
<section id="lessons" aria-label="Занятия"><div class="loading">Загружаем расписание МГТУ…</div></section>
<footer class="footer"><span id="sync" role="status">Соединяемся с сайтом МГТУ</span><a href="https://timetable.magtu.ru/АПОб-22-" target="_blank" rel="noopener noreferrer">Открыть источник ↗</a></footer>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const storage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function localNow(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yekaterinburg',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p=>[p.type,p.value]));const date=new Date(Date.UTC(+p.year,+p.month-1,+p.day));return{date,day:(date.getUTCDay()+6)%7,minute:+p.hour*60+(+p.minute),clock:p.hour+':'+p.minute};}
function parity(date){return (Math.floor((date.getTime()-Date.UTC(2024,7,19))/604800000)+1)%2===0?2:1;}
let initial=localNow(),state={day:initial.day,week:parity(initial.date)},data=null,busy=false,offline=false,lastDate=initial.date.toISOString();
const minute=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c;
function applyTheme(){const theme=storage.get('schedule-theme')||'auto';document.documentElement.style.colorScheme=theme==='auto'?'light dark':theme;$('#theme').value=theme;}
applyTheme();
function card(e,index,current,next,now,isToday){const active=index===current,upcoming=index===next,past=isToday&&minute(e.end)<=now,featured=active||(current<0&&upcoming),start=minute(e.start),end=minute(e.end);const status=active?`<span class="status-label"><span class="dot"></span>Сейчас идёт</span><span>Ещё ${end-now} мин</span>`:upcoming?`<span>Следующая пара</span><span>${isToday?'Через '+(start-now)+' мин':'Первая в этот день'}</span>`:'';return `<article class="lesson ${active?'current':upcoming?'next':past?'past':''} ${featured?'featured':''}"><div class="clock">${escape(e.start)}<small>${escape(e.end)}</small></div><div class="sheet">${status?`<div class="status">${status}</div>`:''}<div class="kind">${escape(e.kind)} · ${e.number} пара</div><h2 class="subject">${escape(e.title)}</h2><div class="meta"><span>${escape(e.teacher)}</span><span class="room">Ауд. ${escape(e.room||'не указана')}</span></div>${active?`<div class="progress" role="progressbar" aria-label="Прошедшее время пары" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((now-start)/(end-start)*100)}"><span style="width:${Math.max(0,Math.min(100,(now-start)/(end-start)*100))}%"></span></div>`:''}</div></article>`;}
function render(){const now=localNow(),realWeek=parity(now.date),isToday=state.day===now.day&&state.week===realWeek;$('#heading').textContent=days[state.day];$('#eyebrow').textContent=isToday?'Сегодня · '+now.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'}):'Расписание группы';$('#date-label').textContent=(state.week===1?'Нечётная':'Чётная')+' неделя';$('#clock').textContent=now.clock+' · Магнитогорск';document.querySelectorAll('[data-week]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.week===state.week)));$('#days').innerHTML=days.slice(0,6).map((d,i)=>{const date=new Date(now.date);date.setUTCDate(date.getUTCDate()-now.day+i);return `<button data-day="${i}" aria-label="${d}" aria-pressed="${i===state.day}" class="${i===now.day?'today':''}">${['Пн','Вт','Ср','Чт','Пт','Сб'][i]}<strong>${state.week===realWeek?date.getUTCDate():['1','2','3','4','5','6'][i]}</strong></button>`}).join('');if(!data)return;
const entries=state.day===6?[]:data.weeks[String(state.week)][state.day];const current=isToday?entries.findIndex(e=>minute(e.start)<=now.minute&&now.minute<minute(e.end)):-1;const next=entries.findIndex(e=>!isToday||minute(e.start)>now.minute);$('#count').textContent=entries.length?entries.length+' '+plural(entries.length,'занятие','занятия','занятий'):'Без занятий';const past=entries.map((e,i)=>({e,i})).filter(({e})=>isToday&&minute(e.end)<=now.minute);const future=entries.map((e,i)=>({e,i})).filter(({e})=>!isToday||minute(e.end)>now.minute);const wasOpen=$('#past-lessons')?.open;
$('#lessons').innerHTML=entries.length?(future.length?future.map(({e,i})=>card(e,i,current,next,now.minute,isToday)).join(''):'<div class="empty"><div class="empty-icon" aria-hidden="true">✓</div><h2>На сегодня всё</h2><p>Все пары закончились. Можно отдыхать.</p></div>')+(past.length?`<details id="past-lessons" ${wasOpen?'open':''}><summary>Прошедшие занятия · ${past.length}</summary>${past.map(({e,i})=>card(e,i,current,next,now.minute,isToday)).join('')}</details>`:''):'<div class="empty"><div class="empty-icon" aria-hidden="true">☀</div><h2>Свободный день</h2><p>По расписанию занятий нет.</p></div>';
const checked=data.checkedAt?new Date(data.checkedAt).toLocaleString('ru-RU',{timeZone:'Asia/Yekaterinburg',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'неизвестно';$('#sync').textContent=(offline?'Сохранённая версия · ':'Обновлено ')+checked+' · проверка обновлений каждые 30 мин';
}
function valid(d){return d?.group==='АПОб-22-'&&[1,2].every(w=>Array.isArray(d.weeks?.[w])&&d.weeks[w].length===6&&d.weeks[w].every(a=>Array.isArray(a)&&a.every(e=>typeof e.title==='string'&&/^\d\d:\d\d$/.test(e.start)&&/^\d\d:\d\d$/.test(e.end))));}
async function load(force=false){if(busy)return;busy=true;$('#refresh').disabled=true;$('#refresh').setAttribute('aria-busy','true');$('#sync').textContent='Обновляем расписание…';try{const response=await fetch('./schedule.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});const fresh=await response.json();if(!response.ok||!valid(fresh))throw Error(fresh.error||'Не удалось прочитать расписание.');data=fresh;offline=false;storage.set('schedule-data-apo22',JSON.stringify(data));const stale=!fresh.checkedAt||Date.now()-new Date(fresh.checkedAt).getTime()>5400000;$('#notice').hidden=!stale;$('#notice').textContent=stale?'Расписание давно не обновлялось. Проверь дату загрузки и официальный источник.':'';render();}catch(e){offline=true;$('#notice').hidden=false;$('#notice').textContent=data?'Не удалось обновить. Показано сохранённое расписание.':'Не удалось загрузить расписание. Проверь интернет и нажми «Проверить».';if(data)render();else{$('#count').textContent='Расписание недоступно';$('#lessons').innerHTML='<div class="empty"><h2>Нет подключения</h2><p>Проверь интернет и попробуй обновить страницу.</p></div>';$('#sync').textContent='Обновление не выполнено';}}finally{busy=false;$('#refresh').disabled=false;$('#refresh').removeAttribute('aria-busy');}}
$('#days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b){state.day=+b.dataset.day;render()}});document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>{state.week=+b.dataset.week;render()}));$('#today').addEventListener('click',()=>{const n=localNow();state.day=n.day;state.week=parity(n.date);render()});$('#refresh').addEventListener('click',()=>load(true));$('#settings-button').addEventListener('click',()=>{$('#settings').hidden=!$('#settings').hidden;$('#settings-button').setAttribute('aria-expanded',String(!$('#settings').hidden))});$('#theme').addEventListener('change',e=>{storage.set('schedule-theme',e.target.value);applyTheme()});
try{const cached=JSON.parse(storage.get('schedule-data-apo22'));if(valid(cached)){data=cached;offline=true;}}catch{}render();load();setInterval(()=>load(),1800000);setInterval(()=>{const n=localNow();if(lastDate!==n.date.toISOString()){lastDate=n.date.toISOString();state.day=n.day;state.week=parity(n.date)}render()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();load()}});
})();
</script></body></html>
